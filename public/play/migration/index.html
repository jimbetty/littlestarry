<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f6f2e9">
<title>候鸟・MIGRATION</title>
<style>
:root{--ink:#3a362c;--paper:#f6f2e9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","Noto Serif CJK SC",serif;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
#stage{position:fixed;left:0;top:0;width:100vw;height:100vh;overflow:hidden}
#stage.rot{width:100vh;height:100vw;left:100vw;transform:rotate(90deg);transform-origin:left top}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
.ui{position:absolute;color:var(--ink);transition:opacity 1.2s}
#shot{left:1.6rem;top:1.3rem;pointer-events:none;letter-spacing:.04em}
#shotName{font-size:1rem}
#shotName b{font-weight:600;letter-spacing:.18em}
#shotName i{font-style:normal;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.72rem;opacity:.7;letter-spacing:.16em;margin-left:.6em}
#shotVar{margin-top:.35rem;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.68rem;letter-spacing:.2em;opacity:.65}
#bar{position:absolute;left:1.6rem;top:3.9rem;width:9rem;height:1px;background:currentColor;opacity:.18}
#bar>div{height:1px;background:currentColor;opacity:1;width:0}
#ctrl{right:1.4rem;top:1.1rem;display:flex;gap:.5rem}
button{font:inherit;color:var(--ink);background:transparent;border:1px solid color-mix(in srgb,var(--ink) 35%,transparent);border-radius:999px;padding:.32rem .9rem;font-size:.78rem;letter-spacing:.12em;cursor:pointer;backdrop-filter:blur(2px)}
button:hover{background:color-mix(in srgb,var(--ink) 8%,transparent)}
button.off{opacity:.45}
#hint{left:1.6rem;bottom:1.3rem;font-size:.72rem;letter-spacing:.24em;opacity:.55;pointer-events:none}
#intro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding-left:9vw;background:linear-gradient(90deg,color-mix(in srgb,var(--paper) 88%,transparent) 0%,color-mix(in srgb,var(--paper) 55%,transparent) 48%,transparent 75%);transition:opacity 1.6s}
#intro h1{margin:0;font-weight:500;font-size:4.2rem;letter-spacing:.3em;line-height:1}
#intro h1 span{display:block;font-family:"Didot","Bodoni 72","Times New Roman",serif;font-size:1.05rem;letter-spacing:1.05em;margin-top:1.1rem;opacity:.75;font-weight:400}
#intro p{margin:1.6rem 0 2.2rem;font-size:.95rem;letter-spacing:.2em;opacity:.75;line-height:2}
#intro .lab{font-size:.72rem;letter-spacing:.35em;opacity:.55;margin-bottom:.7rem}
#scenes{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:2.2rem}
#scenes button{padding:.38rem 1rem}
#scenes button.sel{background:var(--ink);color:var(--paper)}
#go{font-size:1.05rem;padding:.7rem 2rem;letter-spacing:.35em;border-width:1.5px}
#go:hover{background:var(--ink);color:var(--paper)}
.hide{opacity:0!important;pointer-events:none!important}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="hud" class="hide">
    <div id="shot" class="ui"><div id="shotName"></div><div id="shotVar"></div></div>
    <div id="bar"><div></div></div>
    <div id="ctrl" class="ui"><button id="bCam">自动镜头</button><button id="bMusic">音乐</button><button id="bPoem">诗句</button></div>
    <div id="hint" class="ui"></div>
  </div>
  <div id="intro" class="ui">
    <h1>候鸟<span>MIGRATION</span></h1>
    <p>一群纸鸟，沿着一条不会结束的河向南。<br>世界、镜头、音乐与诗，都在路上生成。</p>
    <div class="lab">选择起飞地点</div>
    <div id="scenes"><button data-s="0" class="sel">暖纸</button><button data-s="2">暮粉</button><button data-s="4">夜航</button><button data-s="1">雾境</button><button data-s="3">雪境</button></div>
    <button id="go">开始迁徙 →</button>
  </div>
</div>

/* ---------------- 更新 ---------------- */
const GST = { a: 0, b: 1, t: 0 };

  const c = [S.x, 0, zc];

  // ---- 风：反向 1€ 滤波 ----
  let wv = [0, 0];
  if (S.cur && S.curF) {
    const spd = Math.hypot(S.cur[0] - S.curF[0], S.cur[1] - S.curF[1]) / Math.max(dt, 1e-3);

/* ---------------- 绘制 ---------------- */
const fogMix = (col, fc, f) => [col[0] + (fc[0] - col[0]) * f, col[1] + (fc[1] - col[1]) * f, col[2] + (fc[2] - col[2]) * f];
const css = (c, a) => a === undefined ? `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})` : `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a.toFixed(3)})`;
let FOGN = 1500, FOGF = 4500, FOGC = [240, 230, 210];
const fogF = d => smooth(FOGN, FOGF, d) * 0.97;
const dist3 = (x, y, z) => Math.hypot(x - cp[0], y - cp[1], z - cp[2]);

function rayGround(sx, sy, far) {
  const a = (sx - CX) / FL, b = (sy - CY) / FL;
  const d = [cf[0] + cr[0] * a - cu[0] * b, cf[1] + cr[1] * a - cu[1] * b, cf[2] + cr[2] * a - cu[2] * b];

const DR = []; // 深度排序队列
const SUNL = [0, 1, 0];
function render() {

  const sun = norm3(sc(GST, 'sun')); SUNL[0] = sun[0]; SUNL[1] = sun[1]; SUNL[2] = sun[2];

    const A = Wv[tri[0]], B = Wv[tri[1]], C = Wv[tri[2]];
    if (!proj(A[0], A[1], A[2], PT[0]) || !proj(B[0], B[1], B[2], PT[1]) || !proj(C[0], C[1], C[2], PT[2])) continue;
    const u = [B[0] - A[0], B[1] - A[1], B[2] - A[2]], v = [C[0] - A[0], C[1] - A[1], C[2] - A[2]];
    let n = norm3([u[1] * v[2] - u[2] * v[1], u[2] * v[0] - u[0] * v[2], u[0] * v[1] - u[1] * v[0]]);
    const toC = [cp[0] - A[0], cp[1] - A[1], cp[2] - A[2]]; if (n[0] * toC[0] + n[1] * toC[1] + n[2] * toC[2] < 0) n = n.map(x => -x);
    const l = Math.abs(n[0] * SUNL[0] + n[1] * SUNL[1] + n[2] * SUNL[2]);
    let k = 0.66 + 0.34 * l; if (tri[3] === 'k' || tri[3] === 'k2') k *= 0.86; if (tri[3] === 'wt') k *= 0.97; if (tri[3] === 'h') k *= 0.92;
    const col = fogMix([tint[0] * k, tint[1] * k, tint[2] * k], FOGC, ff);
    TRIQ.push({ z: (PT[0].z + PT[1].z + PT[2].z) / 3, x: [PT[0].x, PT[1].x, PT[2].x], y: [PT[0].y, PT[1].y, PT[2].y], c: col });
  }
  TRIQ.sort((a, b) => b.z - a.z);
  const lw = Math.max(0.4, Math.min(1.2, FL * 0.5 / d));
  ctx.lineJoin = 'round';
  for (const t of TRIQ) {
    ctx.fillStyle = css(t.c); ctx.beginPath(); ctx.moveTo(t.x[0], t.y[0]); ctx.lineTo(t.x[1], t.y[1]); ctx.lineTo(t.x[2], t.y[2]); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = css(mix3(t.c, night > 0.5 ? [255, 255, 255] : [40, 34, 28], 0.22), 0.5); ctx.lineWidth = lw; ctx.stroke();
  }
}
function drawPart(p, x, y, z, night) {
  const s = FL / z;
  if (p.ty === 1) { const r = clamp(2.4 * s * p.s, 0.7, 5 * UIS); ctx.fillStyle = `rgba(255,255,255,${(0.85 * (1 - fogF(z) * 0.6)).toFixed(3)})`; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }
  else if (p.ty === 2) { const r = clamp(3.6 * s * p.s, 0.8, 7 * UIS); ctx.save(); ctx.translate(x, y); ctx.rotate(p.rot); ctx.scale(1, 0.45 + 0.3 * Math.sin(p.rot * 2)); ctx.fillStyle = 'rgba(240,160,176,0.85)'; ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill(); ctx.restore(); }
  else if (p.ty === 3) { const bl = Math.max(0, Math.sin(S.t * (1.2 + p.s) + p.ph * 3)); const r = clamp(2 * s * p.s, 1, 4 * UIS); ctx.fillStyle = `rgba(210,255,150,${(0.12 * bl).toFixed(3)})`; ctx.beginPath(); ctx.arc(x, y, r * 5, 0, TAU); ctx.fill(); ctx.fillStyle = `rgba(236,255,190,${(0.9 * bl).toFixed(3)})`; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }
  else { const r = clamp(1.6 * s * p.s, 0.6, 3.5 * UIS); ctx.fillStyle = `rgba(120,100,70,${(0.35 * (1 - night)).toFixed(3)})`; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }
}

function drawPoem() {
  const ti = S.flyT - 6; if (ti < 0) return;
  const n = Math.floor(ti / POEM_CYCLE), lt = ti - n * POEM_CYCLE; if (lt > POEM_SHOW) return;
  const poem = POEMS[poemOrder[n % POEMS.length]];
  const ink = sc(GST, 'ink');
  const fs = clamp(H * 0.03, 15, 30) * UIS, lh = fs * 2.05;
  const fadeOut = 1 - smooth(POEM_SHOW - 2, POEM_SHOW, lt);
  ctx.font = `${fs}px "Songti SC","STSong","Noto Serif SC","Noto Serif CJK SC",serif`; ctx.textBaseline = 'alphabetic';
  const x0 = W * 0.665, y0 = H * 0.5 - (poem.length - 1) * lh / 2;
  let k = 0, maxW = 0;
  for (let li = 0; li < poem.length; li++) {
    let x = x0; const line = poem[li];
    for (const ch of line) {
      const a = smooth(0, 0.7, lt - 0.4 - k * 0.12) * fadeOut;
      if (a > 0) { ctx.fillStyle = css(ink, a); ctx.fillText(ch, x, y0 + li * lh + (1 - a) * 4); }
      x += ctx.measureText(ch).width + fs * 0.18; k++;
    }
    maxW = Math.max(maxW, x - x0);
  }
  const tl = 0.4 + k * 0.12 + 0.5, prog = smooth(tl, tl + 1.8, lt);
  if (prog > 0) { ctx.fillStyle = css(ink, 0.55 * fadeOut); ctx.fillRect(x0, y0 + (poem.length - 1) * lh + fs * 0.85, maxW * prog, Math.max(1, UIS)); }
}

/* ---------------- HUD ---------------- */
const shotName = document.getElementById('shotName'), shotVar = document.getElementById('shotVar'), barIn = document.querySelector('#bar>div');
let hudTick = 0, lastHud = '';
function updHud() {
  const ink = sc(GST, 'ink'), paper = mix3([246, 242, 233], [24, 28, 44], sv(GST, 'night'));
  document.documentElement.style.setProperty('--ink', css(ink)); document.documentElement.style.setProperty('--paper', css(paper));
  let html, v;
  if (S.free) { html = `<b>自主镜头</b><i>FREE CAM</i>`; v = `${NAMES[GST.t > 0.5 ? GST.b : GST.a]}`; }
  else { const e = curShot; html = `<b>${String(e.s.no).padStart(2, '0')} · ${e.s.zh}</b><i>${e.s.en}</i>`; v = `VAR ${String(e.loop + 1).padStart(2, '0')} · ${e.high ? '高圈' : '低圈'} · ${CATZH[e.cat]} · ${e.tier[0]} · ${NAMES[GST.t > 0.5 ? GST.b : GST.a]}`; }
  if (html + v !== lastHud) { shotName.innerHTML = html; shotVar.textContent = v; lastHud = html + v; }
  if (!S.free) { const e = curShot; barIn.style.width = (clamp((S.flyT - e.start) / e.dur, 0, 1) * 100).toFixed(1) + '%'; }
}

/* ---------------- 主循环（含动态分辨率） ---------------- */
let last = performance.now(), slow = 0, fast = 0;
window.__stat = { fps: 0, rs: 1, draws: 0 };
let fr = 0, fpsT = performance.now();
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  const raw = dt; dt = Math.min(dt, 0.05);
  if (window.__fixedDt) dt = window.__fixedDt;
  // 动态分辨率：在本帧绘制前调整，避免清屏闪黑
  if (raw > 0.026) { slow += Math.min(raw, 0.1); fast = 0; if (slow > 2 && RS > 0.55) { RS = Math.max(0.55, RS * 0.85); resize(); slow = 0; } }
  else if (raw < 0.0155) { fast += raw; slow = Math.max(0, slow - raw); if (fast > 4 && RS < 1) { RS = Math.min(1, RS * 1.08); resize(); fast = 0; } }
  update(dt); render();
  if (++hudTick % 6 === 0) updHud();
  fr++; if (now - fpsT > 1000) { window.__stat.fps = fr * 1000 / (now - fpsT); window.__stat.rs = RS; window.__stat.draws = DR.length; fr = 0; fpsT = now; }
  requestAnimationFrame(frame);
}
// 调试参数：?t=秒 预跑，?style=0-4
(() => {
  const q = new URLSearchParams(location.search);
  if (q.has('style')) setStart(+q.get('style'));
  if (q.has('go')) { S.started = true; intro.classList.add('hide'); hudEl.classList.remove('hide'); }
  if (q.has('x')) S.x = +q.get('x');
  const pre = +(q.get('t') || 0);
  CX = W * 0.4; CY = H / 2;
  for (let t = 0; t < pre; t += 0.05) update(0.05);
  if (q.has('free')) bCam.onclick();
  if (q.has('wind')) { const [a, b] = q.get('wind').split(',').map(Number); S.cur = [W * a, H * b]; S.curF = S.cur.slice(); S.windActive = true; S.lastMove = 1e9; }
  updHud();
})();
requestAnimationFrame(frame);
</script>
