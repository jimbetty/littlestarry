<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>云山巨城</title>
<style>
  :root { --ink: #f3ead6; --dim: rgba(243, 234, 214, 0.62); --red: #c0412f; --glass: rgba(18, 20, 26, 0.42); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0f18; font-family: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif; color: var(--ink); user-select: none; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }
  .glass { background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.10); border-radius: 999px; }
  #title { position: fixed; left: 26px; top: 22px; pointer-events: none; text-shadow: 0 2px 12px rgba(0,0,0,0.45); transition: opacity 1.5s; }
  #title h1 { margin: 0; font-size: 30px; letter-spacing: 12px; font-weight: 700; }
  #title .seal { display: inline-block; margin-left: 6px; width: 22px; height: 22px; line-height: 20px; text-align: center; font-size: 12px; border: 2px solid var(--red); color: var(--red); letter-spacing: 0; vertical-align: 8px; border-radius: 3px; background: rgba(255,240,220,0.85); }
  #title p { margin: 6px 0 0 2px; font-size: 12px; letter-spacing: 3px; color: var(--dim); }
  #bar { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; padding: 8px 18px 8px 10px; }
  #play { width: 34px; height: 34px; border-radius: 50%; border: none; background: rgba(255,255,255,0.14); color: var(--ink); cursor: pointer; font-size: 13px; }
  #play:hover { background: rgba(255,255,255,0.25); }
  #clock { font-size: 22px; font-variant-numeric: tabular-nums; min-width: 66px; letter-spacing: 1px; }
  #shichen { font-size: 13px; color: #e9b98a; min-width: 34px; }
  #slider { width: 300px; accent-color: #e9b98a; cursor: pointer; }
  select { font-family: inherit; font-size: 12px; background: transparent; color: var(--ink); border: 1px solid rgba(255,255,255,0.18); border-radius: 999px; padding: 4px 8px; cursor: pointer; }
  select option { color: #222; }
  #nav { position: fixed; right: 22px; top: 22px; display: flex; gap: 4px; padding: 5px; }
  #nav button { font-family: inherit; font-size: 13px; letter-spacing: 2px; color: var(--ink); background: transparent; border: none; border-radius: 999px; padding: 6px 14px; cursor: pointer; }
  #nav button:hover { background: rgba(255,255,255,0.12); }
  #nav button.on { background: rgba(233, 185, 138, 0.88); color: #1b1712; }
  #spots { position: fixed; right: 22px; top: 70px; padding: 6px; border-radius: 14px; display: none; flex-direction: column; gap: 2px; }
  #spots.open { display: flex; }
  #spots button { font-family: inherit; text-align: left; font-size: 13px; letter-spacing: 1px; color: var(--ink); background: transparent; border: none; border-radius: 8px; padding: 6px 14px; cursor: pointer; }
  #spots button:hover { background: rgba(255,255,255,0.12); }
  #spots button i { font-style: normal; color: var(--dim); margin-right: 8px; font-size: 11px; }
  #help { position: fixed; left: 26px; bottom: 22px; padding: 12px 16px; border-radius: 14px; font-size: 12px; line-height: 1.85; max-width: 330px; display: none; }
  #help.open { display: block; }
  #help b { color: #e9b98a; font-weight: 600; margin-right: 6px; }
  #helpBtn { position: fixed; left: 26px; bottom: 22px; width: 34px; height: 34px; border-radius: 50%; border: none; color: var(--ink); cursor: pointer; font-family: inherit; font-size: 15px; }
  #help.open + #helpBtn { display: none; }
  #caption { position: fixed; left: 50%; top: 24px; transform: translateX(-50%); padding: 7px 18px; font-size: 14px; letter-spacing: 4px; opacity: 0; transition: opacity 0.8s; pointer-events: none; }
  #stats { position: fixed; right: 22px; bottom: 26px; font: 11px/1.4 ui-monospace, Menlo, monospace; color: rgba(255,255,255,0.6); text-shadow: 0 1px 2px #000; display: none; }
  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(ellipse at 50% 60%, #222a3a 0%, #0a0d14 75%); z-index: 10; transition: opacity 1.4s; }
  #loading h2 { font-size: 52px; letter-spacing: 22px; margin: 0 0 8px 22px; font-weight: 700; color: #f1e6cc; }
  #loading .sub { color: #b9a77e; letter-spacing: 6px; font-size: 13px; margin-bottom: 30px; }
  #lbar { width: 280px; height: 2px; background: rgba(255,255,255,0.1); }
  #lbar i { display: block; height: 100%; width: 0; background: #e9b98a; transition: width 0.4s; }
  #ltext { margin-top: 12px; font-size: 12px; color: #9d8e70; letter-spacing: 4px; }
  #hint { position: fixed; left: 50%; bottom: 80px; transform: translateX(-50%); font-size: 12px; letter-spacing: 2px; color: var(--dim); text-shadow: 0 1px 6px rgba(0,0,0,0.6); transition: opacity 1s; pointer-events: none; }
</style>

</div>

<div id="caption" class="glass"></div>
