let SC = 2, OX = 0, OY = 0, DPR = 1;
function fit() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  let s = Math.min(innerWidth / VW, innerHeight / VH); if (s >= 2) s = Math.floor(s);
  SC = s; OX = Math.round((innerWidth - VW * s) / 2); OY = Math.round((innerHeight - VH * s) / 2);
  cv.style.width = VW * s + 'px'; cv.style.height = VH * s + 'px'; cv.style.left = OX + 'px'; cv.style.top = OY + 'px';
  uc.width = innerWidth * DPR; uc.height = innerHeight * DPR;
}

const C = { bg0: '#0b0b0d', bg1: '#141417', bg2: '#1d1d21', bg3: '#29292e', bg4: '#36363c', mid: '#5c5c63', lite: '#a3a3a9', pale: '#d9d8d2', white: '#f5f4ee', ink: '#060607',
  red: '#ff3b3b', redD: '#7a1a1a', cyan: '#8ff4ff', gold: '#ffcc4d', violet: '#b892ff' };
const clamp = (v, a, b) => v < a ? a : v > b ? b : v, lerp = (a, b, t) => a + (b - a) * t;
let seed = (Date.now() % 1e9) | 0;
function rnd() { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
const R = (a, b) => a + rnd() * (b - a), RI = (a, b) => Math.floor(R(a, b + 1)), pick = a => a[Math.floor(rnd() * a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const ov = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

/* ============================ AUDIO ============================ */
const AU = { ctx: null };
function audioInit() {
  if (AU.ctx) { AU.ctx.resume(); return; }
  const C2 = window.AudioContext || window.webkitAudioContext; if (!C2) return;
  const ctx = AU.ctx = new C2();
  const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 4; comp.connect(ctx.destination);
  AU.master = ctx.createGain(); AU.master.gain.value = 0.85; AU.master.connect(comp);
  AU.sfx = ctx.createGain(); AU.sfx.gain.value = 0.9; AU.sfx.connect(AU.master);
  AU.danger = ctx.createGain(); AU.danger.gain.value = 1.1; AU.danger.connect(AU.master);
  AU.mus = ctx.createGain(); AU.mus.gain.value = 0.32; AU.mus.connect(AU.master);
  const nb = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate), d = nb.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; AU.nb = nb;
  // reverb (short room)
  const ir = ctx.createBuffer(2, ctx.sampleRate * 1.6, ctx.sampleRate);
  for (let c = 0; c < 2; c++) { const x = ir.getChannelData(c); for (let i = 0; i < x.length; i++) x[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / x.length, 3); }
  AU.rev = ctx.createConvolver(); AU.rev.buffer = ir; AU.revG = ctx.createGain(); AU.revG.gain.value = 0.28; AU.rev.connect(AU.revG); AU.revG.connect(AU.master);
  musicInit();
}
function nz(dur, o = {}) {
  const ctx = AU.ctx; if (!ctx) return; const t = ctx.currentTime + (o.delay || 0);
  const s = ctx.createBufferSource(); s.buffer = AU.nb; s.playbackRate.value = o.rate || 1;
  const f = ctx.createBiquadFilter(); f.type = o.type || 'bandpass'; f.frequency.setValueAtTime(o.f || 1000, t); if (o.f2) f.frequency.exponentialRampToValueAtTime(o.f2, t + dur); f.Q.value = o.q || 1;
  const gn = ctx.createGain(); gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(o.g || 0.3, t + (o.a || 0.004)); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(gn); gn.connect(o.bus || AU.sfx); if (o.rev) gn.connect(AU.rev);
  s.start(t, Math.random() * 1.5); s.stop(t + dur + 0.05);
}
function tn(freq, dur, o = {}) {
  const ctx = AU.ctx; if (!ctx) return; const t = ctx.currentTime + (o.delay || 0);
  const s = ctx.createOscillator(); s.type = o.type || 'sine'; s.frequency.setValueAtTime(freq, t); if (o.to) s.frequency.exponentialRampToValueAtTime(o.to, t + (o.slide || dur));
  const gn = ctx.createGain(); gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(o.g || 0.3, t + (o.a || 0.004)); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  let out = gn; if (o.lp) { const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp; gn.connect(f); out = f; }
  s.connect(gn); out.connect(o.bus || AU.sfx); if (o.rev) out.connect(AU.rev); s.start(t); s.stop(t + dur + 0.05);
}
function bell(f, dur, g, o = {}) { // inharmonic metal partials — no beeps
  const parts = [[1, 1], [2.76, 0.5], [5.4, 0.28], [8.93, 0.12], [0.5, 0.35]];
  for (const [m, a] of parts) tn(f * m, dur * (m < 1 ? 1.2 : 1 / Math.sqrt(m)), { g: g * a, a: 0.002, bus: o.bus, rev: o.rev ?? true, delay: o.delay });
}
const SFX = {
  swish(h) { if (h) { nz(0.28, { type: 'bandpass', f: 380, f2: 1500, q: 0.8, g: 0.32, a: 0.05 }); tn(110, 0.22, { to: 60, g: 0.12 }); } else nz(0.11, { type: 'bandpass', f: 1600, f2: 4200, q: 1.2, g: 0.18, a: 0.01 }); },
  hit(h, crit) {

    nz(h ? 0.16 : 0.08, { type: 'lowpass', f: h ? 1200 : 2400, g: h ? 0.5 : 0.32 });
    nz(0.03, { type: 'highpass', f: 3500, g: 0.25 });
    if (crit) { bell(1240, 0.35, 0.08); nz(0.12, { type: 'bandpass', f: 5200, q: 3, g: 0.15 }); }

  jump() { nz(0.12, { type: 'bandpass', f: 900, f2: 2200, q: 0.7, g: 0.08 }); },
  djump() { nz(0.18, { type: 'bandpass', f: 600, f2: 2800, q: 0.6, g: 0.12 }); },
  land() { tn(90, 0.08, { to: 50, g: 0.12 }); nz(0.05, { type: 'lowpass', f: 500, g: 0.12 }); },
  step() { nz(0.03, { type: 'lowpass', f: 900, g: 0.035 }); },
  roll() { nz(0.25, { type: 'bandpass', f: 500, f2: 1400, q: 0.6, g: 0.16, a: 0.03 }); },
  bow() { tn(196, 0.25, { type: 'triangle', to: 180, g: 0.18, lp: 1600 }); nz(0.09, { type: 'bandpass', f: 2600, f2: 1200, g: 0.12 }); },
  throwk() { nz(0.07, { type: 'bandpass', f: 3000, f2: 1800, q: 2, g: 0.12 }); },
  thunk() { tn(260, 0.06, { to: 120, g: 0.2 }); nz(0.04, { type: 'lowpass', f: 1800, g: 0.15 }); },

  teleBig() { nz(0.5, { type: 'bandpass', f: 400, f2: 2400, q: 2, g: 0.3, bus: AU.danger, a: 0.1 }); tn(70, 0.6, { to: 45, g: 0.3, bus: AU.danger }); },
  shoot() { tn(240, 0.2, { to: 90, g: 0.15, type: 'triangle', lp: 900 }); nz(0.15, { type: 'lowpass', f: 900, g: 0.12 }); },
  boom() { tn(80, 0.5, { to: 30, g: 0.7 }); nz(0.6, { type: 'lowpass', f: 900, f2: 120, g: 0.7, rev: true }); },
  shock() { bell(330, 1.0, 0.18); nz(0.35, { type: 'bandpass', f: 1200, f2: 300, q: 1.5, g: 0.25 }); },
  blink() { nz(0.18, { type: 'highpass', f: 3000, f2: 800, g: 0.18 }); tn(900, 0.15, { to: 300, g: 0.06 }); },

  pick() { bell(784, 0.8, 0.08); bell(1175, 0.8, 0.05, { delay: 0.06 }); },
  toll() { bell(82, 4, 0.5, { bus: AU.danger }); bell(164, 3, 0.2, { bus: AU.danger }); },
  crack() { nz(0.4, { type: 'lowpass', f: 1200, f2: 200, g: 0.5 }); tn(60, 0.4, { to: 30, g: 0.4 }); },
  door() { nz(0.8, { type: 'lowpass', f: 300, g: 0.35, a: 0.1 }); tn(50, 0.8, { g: 0.2 }); },
  flask() { nz(0.4, { type: 'bandpass', f: 800, f2: 300, q: 3, g: 0.12 }); bell(660, 0.7, 0.06, { delay: 0.1 }); },
  perfect() { bell(1568, 0.6, 0.08); nz(0.3, { type: 'highpass', f: 5000, g: 0.08 }); },
};

/* ---- generative music: drone + sparse bells (explore) + drums (combat/boss) ---- */
const MUS = { intensity: 0, target: 0, boss: 0, next: 0, step: 0 };
function musicInit() {
  const ctx = AU.ctx;
  MUS.lp = ctx.createBiquadFilter(); MUS.lp.type = 'lowpass'; MUS.lp.frequency.value = 260; MUS.lp.Q.value = 2;
  MUS.dg = ctx.createGain(); MUS.dg.gain.value = 0.22; MUS.lp.connect(MUS.dg); MUS.dg.connect(AU.mus);
  for (const f of [55, 55.4, 82.4]) { const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; const gg = ctx.createGain(); gg.gain.value = 0.25; o.connect(gg); gg.connect(MUS.lp); o.start(); }
  const lfo = ctx.createOscillator(); lfo.frequency.value = 0.06; const lg = ctx.createGain(); lg.gain.value = 90; lfo.connect(lg); lg.connect(MUS.lp.frequency); lfo.start();
  MUS.next = ctx.currentTime + 0.2;
}
const SCALE_A = [220, 261.6, 293.7, 329.6, 392, 440, 523.3];
function musicTick() {
  const ctx = AU.ctx; if (!ctx || !MUS.lp) return;
  MUS.intensity += (MUS.target - MUS.intensity) * 0.02;
  MUS.lp.frequency.setTargetAtTime(220 + MUS.intensity * 500, ctx.currentTime, 0.5);
  const bpm = MUS.boss ? 132 : 92, sp = 60 / bpm / 2;
  while (MUS.next < ctx.currentTime + 0.15) {
    const t = MUS.next - ctx.currentTime, s = MUS.step % 16, I = MUS.intensity;
    if (s % 4 === 0 && Math.random() < 0.35 * (1 - I * 0.5)) bell(pick(SCALE_A) * (Math.random() < 0.3 ? 2 : 1), 2.2, 0.035, { bus: AU.mus, delay: t });
    if (I > 0.25) {
      if (s === 0 || s === 8 || (MUS.boss && (s === 6 || s === 14))) tn(95, 0.3, { to: 40, g: 0.5 * I, bus: AU.mus, delay: t });
      if (s === 4 || s === 12) { nz(0.18, { type: 'lowpass', f: 1400, g: 0.28 * I, bus: AU.mus, delay: t }); tn(160, 0.15, { to: 90, g: 0.2 * I, bus: AU.mus, delay: t }); }
      if (I > 0.55 && s % 2 === 1) nz(0.05, { type: 'bandpass', f: 6000, q: 2, g: 0.05 * I, bus: AU.mus, delay: t });
      if (MUS.boss && s % 8 === 0) tn(55, 0.9, { g: 0.25, bus: AU.mus, delay: t, type: 'triangle', lp: 300 });
    }
    MUS.next += sp; MUS.step++;
  }
}

function cardInfo(o) {

  if (o.t === 'wp') { const W = WEAP[o.id]; return { tag: W.kind === 'melee' ? 'MELEE WEAPON' : 'RANGED WEAPON', name: W.name, desc: W.desc, sub: W.crit, col: C.white, icon: o.id, rep: 'Replaces ' + WEAP[W.kind === 'melee' ? p.melee : p.ranged].name }; }
  if (o.t === 'sk') { const S = SKILL[o.id]; return { tag: 'SKILL', name: S.name, desc: S.desc, sub: 'COOLDOWN ' + S.cd + 's', col: C.white, icon: o.id, rep: p.skills[1] ? 'Replaces ' + SKILL[p.skills[1]].name : 'Fills slot E' }; }

function cardRects() { const w = 128, h = 132, gap = 12, x0 = VW / 2 - (w * 3 + gap * 2) / 2; return [0, 1, 2].map(i => ({ x: x0 + i * (w + gap), y: 70, w, h })); }

    if (c.icon) icon('x', c.icon, r.x + r.w / 2 - 10, y0 + 18, 20); else { u.strokeStyle = c.col; u.lineWidth = 1; u.save(); u.translate(r.x + r.w / 2, y0 + 28); u.rotate(Math.PI / 4); u.strokeRect(-6, -6, 12, 12); u.restore(); }
    ut(c.name, r.x + r.w / 2, y0 + 52, 8, c.col, 'center');

function pauseUI() {

/* ============================ MAIN LOOP ============================ */
let last = performance.now(), acc = 0, consumed = false, prevState = 'title';
const STEP = 1 / 120;
function frame(now) {
  let dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (window.__fixed) dt = window.__fixed;
  musicTick();
  if (state === 'title') {
    if (pressed.atk1 || pressed.confirm || pressed.jump || mouse.click) { audioInit(); startRun(); }
    gtime += dt; cam.x += dt * 20; if (cam.x > MC * TS - VW) cam.x = 0; shake = 0;
  } else if (state === 'play') {
    if (pressed.pause) state = 'pause';
    else {
      shake = Math.max(0, shake - dt * 30); flashScr = Math.max(0, flashScr - dt * 2);
      if (hitstop > 0) { hitstop -= dt; }

        acc += dt * sc; let n = 0;
        while (acc >= STEP && n < 8) { update(STEP); acc -= STEP; n++; consumed = true; for (const k in pressed) pressed[k] = false; if (state !== 'play') { acc = 0; break; } }
      }
    }
  } else if (state === 'pause') { if (pressed.pause || pressed.confirm) state = 'play'; }
  else if (state === 'reward') {
    const rs = cardRects();
    if (pressed.left) reward.sel = (reward.sel + 2) % 3; if (pressed.right) reward.sel = (reward.sel + 1) % 3;
    rs.forEach((r, i) => { if (mouse.x > r.x && mouse.x < r.x + r.w && mouse.y > r.y && mouse.y < r.y + r.h) { reward.sel = i; if (mouse.click && reward.t > 0.4) takeReward(reward.opts[i]); } });
    if (reward && reward.t > 0.4) { if (pressed.c1) takeReward(reward.opts[0]); else if (pressed.c2) takeReward(reward.opts[1]); else if (pressed.c3) takeReward(reward.opts[2]); else if (pressed.atk1 || pressed.confirm) takeReward(reward.opts[reward.sel]); }
  } else if (state === 'dead' || state === 'win') {
    gtime += dt; if (pressed.restart || pressed.atk1 || pressed.confirm) startRun();
  }
  render(); renderUI(dt);
  if (consumed || state !== 'play' || prevState !== 'play') for (const k in pressed) pressed[k] = false; mouse.click = false; consumed = false; prevState = state;

}
